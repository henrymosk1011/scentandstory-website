# Publishes a staging preview of work branches to GitHub Pages. Production (main) is
# deployed by Cloudflare Workers Builds, so main does not run this workflow.
# One time setup: repo Settings, Pages, Build and deployment, Source: GitHub Actions.
# The preview is noindex and the inquiry form only works on the Cloudflare deployment.
name: Preview on GitHub Pages

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build preview
        run: node build.mjs
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PREVIEW: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
