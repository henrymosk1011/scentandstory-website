<form class="form" action="/api/contact" method="post" data-form aria-describedby="form-note">
          <p class="form__note" id="form-note">All fields marked required must be completed. We usually reply within two business days.</p>

          <div class="form__grid">
            <div class="field">
              <label class="field__label" for="f-first">First name <span class="field__req">(required)</span></label>
              <input class="field__input" id="f-first" name="firstName" type="text" autocomplete="given-name" required maxlength="80" aria-describedby="f-first-err">
              <p class="field__error" id="f-first-err" data-error-for="f-first"></p>
            </div>
            <div class="field">
              <label class="field__label" for="f-last">Last name <span class="field__req">(required)</span></label>
              <input class="field__input" id="f-last" name="lastName" type="text" autocomplete="family-name" required maxlength="80" aria-describedby="f-last-err">
              <p class="field__error" id="f-last-err" data-error-for="f-last"></p>
            </div>
            <div class="field">
              <label class="field__label" for="f-email">Email <span class="field__req">(required)</span></label>
              <input class="field__input" id="f-email" name="email" type="email" autocomplete="email" inputmode="email" required maxlength="160" aria-describedby="f-email-err">
              <p class="field__error" id="f-email-err" data-error-for="f-email"></p>
            </div>
            <div class="field">
              <label class="field__label" for="f-phone">Phone</label>
              <input class="field__input" id="f-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="40" aria-describedby="f-phone-err">
              <p class="field__error" id="f-phone-err" data-error-for="f-phone"></p>
            </div>
            <div class="field">
              <label class="field__label" for="f-date">Event date</label>
              <input class="field__input" id="f-date" name="eventDate" type="date" aria-describedby="f-date-err">
              <p class="field__error" id="f-date-err" data-error-for="f-date"></p>
            </div>
            <div class="field">
              <label class="field__label" for="f-guests">Estimated guests</label>
              <input class="field__input" id="f-guests" name="guests" type="number" inputmode="numeric" min="1" max="5000" step="1" aria-describedby="f-guests-err">
              <p class="field__error" id="f-guests-err" data-error-for="f-guests"></p>
            </div>
            <div class="field field--full">
              <label class="field__label" for="f-location">Event location</label>
              <input class="field__input" id="f-location" name="location" type="text" autocomplete="address-level2" maxlength="160" placeholder="Venue or city">
            </div>
            <div class="field field--full">
              <label class="field__label" for="f-experience">Experience of interest</label>
              <div class="field__select">
                <select class="field__input" id="f-experience" name="experience" data-experience-select>
                  <option value="Not sure yet">Not sure yet</option>
                  <option value="The Prelude">The Prelude</option>
                  <option value="The Interlude">The Interlude</option>
                  <option value="The Signature Soirée">The Signature Soirée</option>
                  <option value="A custom signature scent">A custom signature scent</option>
                </select>
              </div>
            </div>
            <div class="field field--full">
              <label class="field__label" for="f-message">Tell us about your event <span class="field__req">(required)</span></label>
              <textarea class="field__input field__textarea" id="f-message" name="message" rows="5" required maxlength="4000" aria-describedby="f-message-hint f-message-err"></textarea>
              <p class="field__hint" id="f-message-hint">The occasion, number of bottles, and preferred size (15mL or 30mL) all help us plan.</p>
              <p class="field__error" id="f-message-err" data-error-for="f-message"></p>
            </div>
          </div>

          <div class="form__trap" aria-hidden="true">
            <label for="f-website">Leave this field empty</label>
            <input id="f-website" name="website" type="text" tabindex="-1" autocomplete="off">
          </div>
          <input type="hidden" name="started" value="" data-started>
{{captcha}}

          <div class="form__footer">
            <p class="form__privacy">By sending this form you agree to our <a href="/privacy/">privacy policy</a>. We only use your details to respond to your inquiry.</p>
            <button class="btn form__submit" type="submit" data-magnetic><span class="btn__label">Send inquiry</span></button>
          </div>
          <div class="form__status" role="status" aria-live="polite" data-form-status></div>
        </form>
